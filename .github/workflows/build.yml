name: Build AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip libfuse2 fuse wget
          python3 -m pip install --upgrade pip pyinstaller

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name LinuxTweaker linux_tweaker.py

      - name: Prepare AppDir and pack AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/LinuxTweaker AppDir/usr/bin/

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/LinuxTweaker" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/linux-tweaker.desktop << 'EOF'
          [Desktop Entry]
          Name=Linux Tweaker
          Comment=Graphical tuning shell for Linux Mint / Ubuntu / Debian
          Exec=LinuxTweaker
          Icon=linux-tweaker
          Type=Application
          Categories=System;Settings;
          Terminal=false
          EOF

          touch AppDir/linux-tweaker.png

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage AppDir LinuxTweaker-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinuxTweaker-AppImage
          path: LinuxTweaker-x86_64.AppImage

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LinuxTweaker-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
