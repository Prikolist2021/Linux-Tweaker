      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/LinuxTweaker AppDir/usr/bin/
          
          # AppRun
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/LinuxTweaker" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Desktop file (обязательно!)
          cat > AppDir/linux-tweaker.desktop << 'EOF'
          [Desktop Entry]
          Name=Linux Tweaker
          Comment=Graphical tuning shell for Linux Mint / Ubuntu / Debian
          Exec=LinuxTweaker
          Icon=linux-tweaker
          Type=Application
          Categories=System;Settings;
          Terminal=false
          EOF
          
          # Иконка-заглушка (замените на реальную, если есть)
          touch AppDir/linux-tweaker.png
          
          # appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage AppDir LinuxTweaker-x86_64.AppImage
