name: Build AppImage

on:
  # Запуск при создании тега (релиза)
  push:
    tags:
      - 'v*'
  # Возможность запустить вручную из интерфейса GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # appimage-builder требует много зависимостей, устанавливаем
      - name: Install appimage-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-venv \
            desktop-file-utils libgdk-pixbuf2.0-dev fakeroot \
            fuse libfuse2
          python3 -m pip install --user appimage-builder
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Создаём простую иконку, если её нет в репозитории
      - name: Create placeholder icon (if missing)
        run: |
          if [ ! -f icon.png ]; then
            # Генерируем простую PNG через Python (или скачайте свою)
            python3 -c "
          from PyQt5.QtGui import QPixmap, QPainter, QColor
          from PyQt5.QtCore import Qt
          img = QPixmap(256, 256)
          img.fill(Qt.transparent)
          p = QPainter(img)
          p.setBrush(QColor('#4ec9b0'))
          p.setPen(Qt.NoPen)
          p.drawRoundedRect(20, 20, 216, 216, 60, 60)
          p.end()
          img.save('icon.png')
          "
          fi

      - name: Build AppImage
        run: |
          appimage-builder --recipe AppImageBuilder.yml

      # Проверяем, что файл создался
      - name: List generated files
        run: ls -la *.AppImage

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Tweaker-AppImage
          path: ./*.AppImage

      # Если это тег, создаём релиз и прикрепляем AppImage
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ./*.AppImage
          generate_release_notes: true
