name: Build AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-venv \
            python3-pyqt5 \
            desktop-file-utils libgdk-pixbuf2.0-dev fakeroot \
            fuse libfuse2 imagemagick

      - name: Install appimage-builder
        run: |
          python3 -m pip install --user appimage-builder
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # --- Создание иконки, если её нет в репозитории ---
      - name: Create placeholder icon (if missing)
        run: |
          if [ ! -f icon.png ]; then
            # Простой зелёный квадрат с закруглением через ImageMagick
            convert -size 256x256 xc:none \
              -fill '#4ec9b0' -draw 'roundrectangle 20,20 236,236 60,60' \
              icon.png
            echo "Placeholder icon.png created"
          else
            echo "icon.png already present, skipping"
          fi

      - name: Build AppImage
        run: |
          appimage-builder --recipe AppImageBuilder.yml

      - name: List generated files
        run: ls -la *.AppImage

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Tweaker-AppImage
          path: ./*.AppImage

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ./*.AppImage
          generate_release_notes: true
